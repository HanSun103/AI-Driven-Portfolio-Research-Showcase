name: Daily research NewsAPI fetch

on:
  schedule:
    - cron: '17 20 * * *'
    - cron: '47 23 * * *' # Recovery opportunity; persisted quota applies to both.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run offline tests only; make no provider requests
        type: boolean
        default: true
      bootstrap:
        description: Initialize the first 48-hour archive only if no saved state exists
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: newsapi-research-archive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only archive encryption dependency
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt
      - name: Offline integrity tests
        run: python -B -m unittest discover -s automation/tests -v
      - name: Restore state and reserve request budget
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWS_ARCHIVE_KEY: ${{ secrets.NEWS_ARCHIVE_KEY }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = 'true' ]; then
            python -B automation/newsapi_fetch.py prepare --bootstrap
          else
            python -B automation/newsapi_fetch.py prepare
          fi
      - name: Persist quota reservation before provider requests
        if: github.event_name == 'schedule' || inputs.dry_run == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newsapi-state-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: private/run/reserved/state.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Fetch bounded research windows
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWS_ARCHIVE_KEY: ${{ secrets.NEWS_ARCHIVE_KEY }}
        run: python -B automation/newsapi_fetch.py collect
      - name: Persist encrypted batch before advancing state
        if: github.event_name == 'schedule' || inputs.dry_run == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newsapi-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: private/run/batch.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Persist final encrypted state
        if: github.event_name == 'schedule' || inputs.dry_run == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newsapi-state-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: private/run/final/state.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Surface unresolved coverage after durable upload
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          NEWS_ARCHIVE_KEY: ${{ secrets.NEWS_ARCHIVE_KEY }}
        run: python -B automation/newsapi_fetch.py status
