<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Dominant ticker exclusion stress test</title>
  <desc id="desc">The frozen controller retains a 23.03 percent gross CAGR after its three dominant historical contributors are excluded before selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf8f5"/></linearGradient>
    <style>
      .title{font:700 27px Inter,Segoe UI,sans-serif;fill:#10213f}.sub{font:14px Inter,Segoe UI,sans-serif;fill:#66738a}.label{font:600 14px Inter,Segoe UI,sans-serif;fill:#30405c}.value{font:700 18px Inter,Segoe UI,sans-serif}.axis{font:12px Inter,Segoe UI,sans-serif;fill:#728096}.call{font:600 14px Inter,Segoe UI,sans-serif;fill:#253554}
    </style>
  </defs>
  <rect width="1000" height="560" rx="26" fill="url(#bg)"/>
  <text x="45" y="52" class="title">Does the signal survive without its dominant winners?</text>
  <text x="45" y="79" class="sub">Ex-ante test: remove the three dominant contributors, then force the frozen controller to choose again</text>

  <g transform="translate(80 125)">
    <line x1="185" y1="0" x2="185" y2="300" stroke="#cbd4e2"/>
    <line x1="185" y1="300" x2="820" y2="300" stroke="#cbd4e2"/>
    <text x="0" y="38" class="label">Original top choice</text>
    <rect x="185" y="14" width="581" height="34" rx="9" fill="#3157d5"/><text x="780" y="38" class="value" fill="#3157d5">29.04%</text>

    <text x="0" y="108" class="label">Dominant three excluded</text>
    <rect x="185" y="84" width="461" height="34" rx="9" fill="#0f9f8d"/><text x="660" y="108" class="value" fill="#0f9f8d">23.03%</text>

    <text x="0" y="178" class="label">SPY</text>
    <rect x="185" y="154" width="246" height="34" rx="9" fill="#e49a18"/><text x="445" y="178" class="value" fill="#b6780d">12.31%</text>

    <text x="0" y="248" class="label">Next nine, equal weight</text>
    <rect x="185" y="224" width="227" height="34" rx="9" fill="#8a58d6"/><text x="426" y="248" class="value" fill="#8a58d6">11.36%</text>

    <text x="185" y="324" class="axis">0%</text><text x="391" y="324" class="axis">10%</text><text x="597" y="324" class="axis">20%</text><text x="803" y="324" class="axis">30%</text>
  </g>

  <rect x="45" y="470" width="910" height="60" rx="16" fill="#dff4ee"/>
  <text x="65" y="494" class="call">Result: the next eligible candidates preserve much of the CAGR advantage.</text>
  <text x="65" y="516" class="sub">Caution: Sharpe falls to 0.761 and drawdown remains -49.87%, so the test supports selection skill, not safety.</text>
</svg>
