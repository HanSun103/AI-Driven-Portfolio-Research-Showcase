<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Weekly overlapping sleeve schedule</title>
  <desc id="desc">A twenty-session strategy adds one sleeve each week, reaches four active sleeves, then exits the oldest sleeve as a new sleeve enters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14213d" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 27px Inter,Segoe UI,sans-serif;fill:#10213f}.sub{font:15px Inter,Segoe UI,sans-serif;fill:#53627a}.week{font:700 15px Inter,Segoe UI,sans-serif;fill:#253554}.slot{font:700 15px Inter,Segoe UI,sans-serif;fill:#fff}.note{font:600 14px Inter,Segoe UI,sans-serif;fill:#263752}.small{font:13px Inter,Segoe UI,sans-serif;fill:#637087}
    </style>
  </defs>
  <rect width="1100" height="500" rx="28" fill="url(#bg)"/>
  <text x="50" y="55" class="title">Trade and hold: weekly decisions, overlapping positions</text>
  <text x="50" y="83" class="sub">20-session example. Each stock is held for four trading weeks; the portfolio does not switch everything each day.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="110" width="1016" height="282" rx="20" fill="#fff"/>
  </g>

  <g transform="translate(70 138)">
    <text x="0" y="28" class="week">Week 1</text>
    <text x="0" y="78" class="week">Week 2</text>
    <text x="0" y="128" class="week">Week 3</text>
    <text x="0" y="178" class="week">Week 4</text>
    <text x="0" y="228" class="week">Week 5</text>

    <g transform="translate(105 0)">
      <rect x="0" y="4" width="155" height="34" rx="9" fill="#3157d5"/><text x="77.5" y="27" text-anchor="middle" class="slot">A</text>

      <rect x="0" y="54" width="155" height="34" rx="9" fill="#3157d5"/><text x="77.5" y="77" text-anchor="middle" class="slot">A</text>
      <rect x="165" y="54" width="155" height="34" rx="9" fill="#0f9f8d"/><text x="242.5" y="77" text-anchor="middle" class="slot">B</text>

      <rect x="0" y="104" width="155" height="34" rx="9" fill="#3157d5"/><text x="77.5" y="127" text-anchor="middle" class="slot">A</text>
      <rect x="165" y="104" width="155" height="34" rx="9" fill="#0f9f8d"/><text x="242.5" y="127" text-anchor="middle" class="slot">B</text>
      <rect x="330" y="104" width="155" height="34" rx="9" fill="#8a58d6"/><text x="407.5" y="127" text-anchor="middle" class="slot">C</text>

      <rect x="0" y="154" width="155" height="34" rx="9" fill="#3157d5"/><text x="77.5" y="177" text-anchor="middle" class="slot">A</text>
      <rect x="165" y="154" width="155" height="34" rx="9" fill="#0f9f8d"/><text x="242.5" y="177" text-anchor="middle" class="slot">B</text>
      <rect x="330" y="154" width="155" height="34" rx="9" fill="#8a58d6"/><text x="407.5" y="177" text-anchor="middle" class="slot">C</text>
      <rect x="495" y="154" width="155" height="34" rx="9" fill="#e49a18"/><text x="572.5" y="177" text-anchor="middle" class="slot">D</text>

      <rect x="0" y="204" width="155" height="34" rx="9" fill="#e7ebf3"/><text x="77.5" y="227" text-anchor="middle" class="note">A exits</text>
      <rect x="165" y="204" width="155" height="34" rx="9" fill="#0f9f8d"/><text x="242.5" y="227" text-anchor="middle" class="slot">B</text>
      <rect x="330" y="204" width="155" height="34" rx="9" fill="#8a58d6"/><text x="407.5" y="227" text-anchor="middle" class="slot">C</text>
      <rect x="495" y="204" width="155" height="34" rx="9" fill="#e49a18"/><text x="572.5" y="227" text-anchor="middle" class="slot">D</text>
      <rect x="660" y="204" width="155" height="34" rx="9" fill="#e45578"/><text x="737.5" y="227" text-anchor="middle" class="slot">E enters</text>
    </g>
  </g>

  <rect x="50" y="420" width="485" height="52" rx="14" fill="#e8eeff"/>
  <text x="70" y="442" class="note">20 sessions: four equal-capital sleeve slots</text>
  <text x="70" y="461" class="small">After ramp-up, one sleeve enters as the oldest exits.</text>
  <rect x="565" y="420" width="485" height="52" rx="14" fill="#e2f6f2"/>
  <text x="585" y="442" class="note">40 sessions: eight equal-capital sleeve slots</text>
  <text x="585" y="461" class="small">The same weekly process, with an eight-week exact hold.</text>
</svg>
