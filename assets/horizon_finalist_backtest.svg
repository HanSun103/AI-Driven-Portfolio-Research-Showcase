<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Ten-year primary and comparison finalist backtest</title>
  <desc id="desc">The primary finalist has the highest CAGR, while SPY has the highest net Sharpe and smallest drawdown and CVaR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#f3efff"/></linearGradient>
    <style>
      .title{font:700 27px Inter,Segoe UI,sans-serif;fill:#10213f}.sub{font:14px Inter,Segoe UI,sans-serif;fill:#66738a}.head{font:700 15px Inter,Segoe UI,sans-serif;fill:#24334f}.value{font:700 22px Inter,Segoe UI,sans-serif}.label{font:13px Inter,Segoe UI,sans-serif;fill:#5f6c82}.axis{font:12px Inter,Segoe UI,sans-serif;fill:#728096}.call{font:600 14px Inter,Segoe UI,sans-serif;fill:#253554}.headlight{font:700 15px Inter,Segoe UI,sans-serif;fill:#fff}.sublight{font:14px Inter,Segoe UI,sans-serif;fill:#dce6f7}
    </style>
  </defs>
  <rect width="1100" height="610" rx="26" fill="url(#bg)"/>
  <text x="45" y="52" class="title">Full development replay: growth is strong, risk is not solved</text>
  <text x="45" y="79" class="sub">December 2013 to December 2023, exact overlapping sleeves, declared-cost net results</text>

  <g transform="translate(45 110)">
    <rect width="1010" height="142" rx="18" fill="#fff"/>
    <text x="25" y="32" class="head">Net CAGR</text>
    <rect x="155" y="20" width="648" height="22" rx="7" fill="#3157d5"/><text x="818" y="37" class="value" fill="#3157d5">31.23%</text><text x="155" y="58" class="label">Primary finalist</text>
    <rect x="155" y="68" width="492" height="22" rx="7" fill="#0f9f8d"/><text x="662" y="85" class="value" fill="#0f9f8d">23.68%</text><text x="155" y="106" class="label">Comparison finalist</text>
    <rect x="155" y="116" width="273" height="10" rx="5" fill="#e49a18"/><text x="443" y="128" class="head" fill="#b6780d">SPY 13.13%</text>
  </g>

  <g transform="translate(45 255)">
    <rect width="315" height="210" rx="18" fill="#fff"/>
    <text x="24" y="34" class="head">Net Sharpe</text>
    <text x="24" y="76" class="value" fill="#3157d5">0.806</text><text x="105" y="75" class="label">Primary</text>
    <text x="24" y="117" class="value" fill="#0f9f8d">0.737</text><text x="105" y="116" class="label">Comparison</text>
    <text x="24" y="158" class="value" fill="#b6780d">0.816</text><text x="105" y="157" class="label">SPY</text>
    <rect x="20" y="177" width="275" height="17" rx="8" fill="#fff3d9"/>
    <text x="157" y="190" text-anchor="middle" class="call">SPY remains the risk-adjusted leader</text>
  </g>

  <g transform="translate(378 255)">
    <rect width="315" height="210" rx="18" fill="#fff"/>
    <text x="24" y="34" class="head">Maximum drawdown</text>
    <text x="24" y="76" class="value" fill="#d64b68">-49.74%</text><text x="132" y="75" class="label">Primary net</text>
    <text x="24" y="117" class="value" fill="#d64b68">-46.43%</text><text x="132" y="116" class="label">Comparison net</text>
    <text x="24" y="158" class="value" fill="#b6780d">-32.05%</text><text x="132" y="157" class="label">SPY</text>
    <rect x="20" y="177" width="275" height="17" rx="8" fill="#ffe9ee"/>
    <text x="157" y="190" text-anchor="middle" class="call">Active portfolios fall further</text>
  </g>

  <g transform="translate(711 255)">
    <rect width="344" height="210" rx="18" fill="#fff"/>
    <text x="24" y="34" class="head">Daily CVaR 95%, gross</text>
    <text x="24" y="76" class="value" fill="#d64b68">-5.76%</text><text x="120" y="75" class="label">Primary</text>
    <text x="24" y="117" class="value" fill="#d64b68">-5.14%</text><text x="120" y="116" class="label">Comparison</text>
    <text x="24" y="158" class="value" fill="#b6780d">-2.64%</text><text x="120" y="157" class="label">SPY</text>
    <rect x="20" y="177" width="304" height="17" rx="8" fill="#ffe9ee"/>
    <text x="172" y="190" text-anchor="middle" class="call">Tail losses remain materially larger</text>
  </g>

  <rect x="45" y="490" width="1010" height="82" rx="18" fill="#162947"/>
  <text x="70" y="520" class="headlight">Interpretation</text>
  <text x="70" y="547" class="sublight">The backtest supports prospective monitoring, not immediate scaling. Promotion requires operational agreement,</text>
  <text x="70" y="567" class="sublight">risk improvement and independent confirmation, not cumulative return alone.</text>
</svg>
